name: Build blog

# When a post in content/blog changes on main, regenerate the blog data, the
# per-post pages (blog/<slug>.html) and the sitemap, and commit the result.
on:
  push:
    branches: [main]
    paths:
      - "content/blog/**"
      - "scripts/build-blog.js"
      - "article.html"
      - "package.json"
      - "package-lock.json"
      - "scripts/sync-seo.js"
      - "assets/js/i18n/en/services.json"
      - "assets/js/i18n/en/pages/home.json"
      - "assets/js/i18n/en/team.json"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-blog
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build blog pages
        run: node scripts/build-blog.js

      - name: Sync page titles and descriptions
        run: node scripts/sync-seo.js

      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "Nothing to commit"
          else
            git commit -m "Build blog pages [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
