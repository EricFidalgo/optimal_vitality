<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>OVI Wellness — Blog Content Manager</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      /* Base Theme & Typography */
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        background-color: #f3f5f5 !important;
        color: #1a202c !important;
      }

      /* Main Top Header Bar */
      header[class*="AppHeader"] {
        background-color: #051411 !important;
        border-bottom: 2px solid #b89146 !important;
        box-shadow: 0 4px 20px rgba(0,0,0,0.15) !important;
      }
      header[class*="AppHeader"] a, 
      header[class*="AppHeader"] button {
        font-family: 'Urbanist', sans-serif !important;
        font-weight: 600 !important;
        letter-spacing: 0.5px !important;
      }

      /* Save / Publish Buttons */
      button[class*="PublishButton"] {
        background-color: #b89146 !important;
        color: #ffffff !important;
        border: none !important;
        font-weight: 700 !important;
        border-radius: 8px !important;
        padding: 8px 20px !important;
        box-shadow: 0 2px 10px rgba(184, 145, 70, 0.3) !important;
      }
      button[class*="PublishButton"]:hover {
        background-color: #a37f3b !important;
        transform: translateY(-1px);
      }

      /* List Control Container (Outer Box) */
      div[class*="ListControl"] {
        background: #ffffff !important;
        border: 1px solid #e2e8f0 !important;
        border-radius: 14px !important;
        padding: 16px !important;
        box-shadow: 0 4px 15px rgba(0,0,0,0.03) !important;
      }

      /* Individual Blog Post Cards ("Folder looking things") */
      div[class*="ListControl"] > div > div > div[class*="ObjectControl"],
      div[class*="ListControl"] > div[class*="ListControl-list"] > div,
      div[class*="ListItem"],
      div[class*="ListControl"] div[class*="TopBar"] {
        background-color: #ffffff !important;
        border: 1.5px solid #e2e8f0 !important;
        border-radius: 10px !important;
        margin-bottom: 10px !important;
        transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1) !important;
      }

      /* Card Hover Effect */
      div[class*="ListControl"] > div[class*="ListControl-list"] > div:hover,
      div[class*="ListItem"]:hover {
        border-color: #b89146 !important;
        box-shadow: 0 6px 18px rgba(5, 20, 17, 0.08) !important;
        background-color: #fdfbf7 !important;
      }

      /* Full Header Click Target — Cursor Pointer */
      div[class*="TopBar"],
      div[class*="ListItemHeader"],
      header[class*="ListControl-header"],
      div[class*="ListControl"] div[class*="TopBar"] {
        cursor: pointer !important;
        padding: 14px 18px !important;
        user-select: none !important;
      }

      /* Styled Expand/Collapse Arrow Icon */
      svg[class*="Icon-icon-direction-right"],
      svg[class*="Icon-icon-direction-down"],
      button[class*="ExpandButton"] {
        color: #b89146 !important;
        transform: scale(1.3) !important;
        transition: transform 0.2s ease !important;
      }

      /* Styled "Add Blog Posts +" Button */
      button[class*="AddButton"],
      button[class*="ListControl-addButton"] {
        background-color: #051411 !important;
        color: #e6c381 !important;
        border: 1px solid #b89146 !important;
        border-radius: 8px !important;
        font-weight: 700 !important;
        padding: 8px 18px !important;
        font-family: 'Urbanist', sans-serif !important;
        letter-spacing: 0.5px !important;
        box-shadow: 0 2px 10px rgba(5, 20, 17, 0.15) !important;
        transition: all 0.2s ease !important;
      }
      button[class*="AddButton"]:hover,
      button[class*="ListControl-addButton"]:hover {
        background-color: #0c2722 !important;
        color: #ffffff !important;
        transform: translateY(-1px);
        box-shadow: 0 4px 15px rgba(5, 20, 17, 0.25) !important;
      }

      /* Input Fields */
      input[class*="StringControl"],
      textarea[class*="TextControl"] {
        border-radius: 6px !important;
        border: 1px solid #cbd5e1 !important;
        padding: 10px 14px !important;
        font-family: 'Inter', sans-serif !important;
        font-size: 0.95rem !important;
      }
      input[class*="StringControl"]:focus,
      textarea[class*="TextControl"]:focus {
        border-color: #b89146 !important;
        box-shadow: 0 0 0 3px rgba(184, 145, 70, 0.15) !important;
      }
    </style>
  </head>
  <body>
    <!-- Decap CMS: loads the full admin UI -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>

    <script>
      // Enhanced Interaction Helper:
      // 1. Click anywhere on a post card header to open/close it (instead of precise arrow click)
      // 2. Prepend newly added blog posts to the TOP of the editor list
      document.addEventListener("click", function(e) {
        // --- 1. Easy Click-to-Open Card Header ---
        const cardHeader = e.target.closest('div[class*="TopBar"], div[class*="ListItemHeader"]');
        if (cardHeader) {
          // Avoid triggering toggle if user clicked on delete button, drag handle, or form inputs
          const isActionBtn = e.target.closest('button[class*="Delete"], button[class*="Remove"], svg[class*="drag"], input, textarea, select');
          if (!isActionBtn) {
            // Find expand arrow or toggle button inside this card
            const toggleIcon = cardHeader.querySelector('svg[class*="direction"], button[class*="Expand"], [class*="Icon"]');
            if (toggleIcon && e.target !== toggleIcon && !toggleIcon.contains(e.target)) {
              toggleIcon.click();
            }
          }
        }

        // --- 2. Force Newly Added Posts to TOP ---
        const addBtn = e.target.closest('button[class*="AddButton"], button[class*="ListControl-addButton"]');
        if (addBtn) {
          setTimeout(function() {
            // Find the list container
            const listParent = addBtn.closest('div[class*="ListControl"]');
            if (listParent) {
              const listItemsContainer = listParent.querySelector('div[class*="ListControl-list"], div[class*="ControlContainer"]');
              if (listItemsContainer && listItemsContainer.children.length > 1) {
                // The newly added item is at the end (last child) — move it to first child position
                const newItem = listItemsContainer.lastElementChild;
                const firstItem = listItemsContainer.firstElementChild;
                if (newItem && firstItem && newItem !== firstItem) {
                  listItemsContainer.insertBefore(newItem, firstItem);
                  // Scroll smoothly to top of list container
                  newItem.scrollIntoView({ behavior: 'smooth', block: 'nearest' });
                }
              }
            }
          }, 80);
        }
      });
    </script>
  </body>
</html>
