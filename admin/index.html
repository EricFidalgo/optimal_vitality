<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex, nofollow" />
    <title>OVI Wellness — Blog Content Manager</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Urbanist:wght@500;600;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <!-- Netlify Identity Widget -->
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <style>
      /* Custom Styling to make Decap CMS Editor look modern & high-end */
      body {
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif !important;
        background-color: #f6f8f8 !important;
      }
      /* Main Header Bar */
      header[class*="AppHeader"] {
        background-color: #051411 !important;
        border-bottom: 2px solid #b89146 !important;
        box-shadow: 0 4px 15px rgba(0,0,0,0.15) !important;
      }
      /* Top Header Links / Logo */
      header[class*="AppHeader"] a, 
      header[class*="AppHeader"] button {
        font-family: 'Urbanist', sans-serif !important;
        font-weight: 600 !important;
        letter-spacing: 0.5px !important;
      }
      /* Buttons */
      button[class*="Button-button"] {
        border-radius: 8px !important;
        font-weight: 600 !important;
        transition: all 0.2s ease !important;
      }
      /* Save / Publish Button */
      button[class*="PublishButton"] {
        background-color: #b89146 !important;
        color: #ffffff !important;
        border: none !important;
      }
      button[class*="PublishButton"]:hover {
        background-color: #a37f3b !important;
        transform: translateY(-1px);
      }
      /* Collection Cards & Inputs */
      div[class*="ControlContainer"] {
        border-radius: 8px !important;
        border: 1px solid #e2e8f0 !important;
        box-shadow: 0 2px 6px rgba(0,0,0,0.02) !important;
      }
      input[class*="StringControl"],
      textarea[class*="TextControl"] {
        border-radius: 6px !important;
        font-family: 'Inter', sans-serif !important;
        font-size: 0.95rem !important;
      }
      /* Object / List Cards */
      div[class*="ListControl"] {
        border-radius: 12px !important;
      }
    </style>
  </head>
  <body>
    <!-- Decap CMS: loads the full admin UI -->
    <script src="https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js"></script>
  </body>
</html>
