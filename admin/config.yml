backend:
  name: git-gateway
  branch: main

# Files are committed directly to the repository — no media uploads needed
media_folder: "assets/images/blog"
public_folder: "/assets/images/blog"

# Saves go live immediately upon clicking Publish
publish_mode: simple

collections:

  # ───────────────────────────────────────────────────────────────────────────
  # ENGLISH BLOG CONTENT
  # ───────────────────────────────────────────────────────────────────────────
  - name: "blog_en"
    label: "English Blog"
    label_singular: "English Blog"

    files:
      - name: "blog_en_posts"
        label: "Blog Posts & Page Copy (English)"
        file: "assets/js/i18n/en/blog.json"
        fields:

          # ── Blog posts array (Listed First for Maximum Simplicity) ──
          - label: "Articles / Blog Posts"
            name: "posts"
            widget: "list"
            summary: "📰 {{fields.title}} [{{fields.category}} — {{fields.date}}]"
            fields:
              - label: "Title"
                name: "title"
                widget: "string"
                hint: "The main headline of your article."
              - label: "Post ID (URL Link)"
                name: "id"
                widget: "string"
                hint: "Unique URL slug (e.g. 'what-is-retatrutide'). Must match between English & Spanish versions!"
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - "Medical Weight Loss"
                  - "Peptide Therapy"
                  - "Hormone Optimization"
                  - "Advanced Diagnostics"
                  - "Regenerative Medicine"
                  - "Detox & Recovery"
                  - "IV Therapy"
              - label: "Author Name & Title"
                name: "author"
                widget: "string"
                hint: "E.g. Dr. Marcus Vance, MD"
              - label: "Publish Date"
                name: "date"
                widget: "string"
                hint: "E.g. August 14, 2026"
              - label: "Card Preview Summary"
                name: "excerpt"
                widget: "text"
                hint: "Short 1-2 sentence preview displayed on the main blog page grid."

              # Article Sections
              - label: "Article Content Sections"
                name: "content"
                widget: "object"
                fields:
                  - { label: "Clinical Overview", name: "overview", widget: "markdown", hint: "Main introduction and overview of the protocol." }
                  - { label: "Consumer Safety", name: "consumerSafety", widget: "markdown", hint: "Safety considerations and clinical oversight." }
                  - { label: "Candidacy Requirements", name: "candidacyRequirements", widget: "markdown", hint: "Who is a good candidate for this therapy." }
                  - { label: "Timeline Expectations", name: "timelineExpectations", widget: "markdown", hint: "What results to expect over time." }
                  - { label: "Potential Downtime", name: "downtime", widget: "markdown", hint: "Physical recovery or downtime required." }
                  - { label: "Expected Results", name: "expectedResults", widget: "markdown", hint: "Clinical trial data and expected outcomes." }
                  - { label: "Clinical Risks", name: "clinicalRisks", widget: "markdown", hint: "Known side effects and risks." }

          # ── Technical Page Settings (Collapsed by default) ──
          - label: "⚙️ Page Header & UI Settings (Advanced)"
            name: "ui_settings"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Hero Eyebrow Text", name: "heroEyebrow", widget: "string" }
              - { label: "Hero Main Headline", name: "heroHeadline", widget: "string" }
              - { label: "Hero Subheadline", name: "heroSubheadline", widget: "text" }
              - { label: "Browser Tab Title", name: "pageTitle", widget: "string" }

  # ───────────────────────────────────────────────────────────────────────────
  # SPANISH BLOG CONTENT
  # ───────────────────────────────────────────────────────────────────────────
  - name: "blog_es"
    label: "Spanish Blog (Español)"
    label_singular: "Spanish Blog (Español)"

    files:
      - name: "blog_es_posts"
        label: "Blog Posts & Page Copy (Spanish)"
        file: "assets/js/i18n/es/blog.json"
        fields:

          # ── Blog posts array (Listed First) ──
          - label: "Artículos / Blog Posts (Español)"
            name: "posts"
            widget: "list"
            summary: "📰 {{fields.title}} [{{fields.category}} — {{fields.date}}]"
            fields:
              - label: "Título / Title"
                name: "title"
                widget: "string"
              - label: "ID del Artículo (URL Link)"
                name: "id"
                widget: "string"
                hint: "Debe ser IDÉNTICO a la versión en inglés (ej. 'what-is-retatrutide')."
              - label: "Categoría / Category"
                name: "category"
                widget: "select"
                options:
                  - "Pérdida de Peso Médica"
                  - "Terapia de Péptidos"
                  - "Optimización Hormonal"
                  - "Diagnósticos Avanzados"
                  - "Medicina Regenerativa"
                  - "Desintoxicación y Recuperación"
                  - "Terapia IV"
              - label: "Autor / Author"
                name: "author"
                widget: "string"
              - label: "Fecha / Date"
                name: "date"
                widget: "string"
                hint: "Ej. 14 de agosto de 2026"
              - label: "Resumen Breve / Excerpt"
                name: "excerpt"
                widget: "text"

              # Article Sections
              - label: "Secciones del Artículo / Article Content"
                name: "content"
                widget: "object"
                fields:
                  - { label: "Resumen Clínico / Clinical Overview", name: "overview", widget: "markdown" }
                  - { label: "Seguridad del Consumidor / Consumer Safety", name: "consumerSafety", widget: "markdown" }
                  - { label: "Requisitos de Candidatura / Candidacy Requirements", name: "candidacyRequirements", widget: "markdown" }
                  - { label: "Expectativas de Tiempo / Timeline", name: "timelineExpectations", widget: "markdown" }
                  - { label: "Tiempo de Inactividad / Downtime", name: "downtime", widget: "markdown" }
                  - { label: "Resultados Esperados / Expected Results", name: "expectedResults", widget: "markdown" }
                  - { label: "Riesgos Clínicos / Clinical Risks", name: "clinicalRisks", widget: "markdown" }

          # ── Technical Page Settings (Collapsed by default) ──
          - label: "⚙️ Configuración de Página (Avanzado)"
            name: "ui_settings"
            widget: "object"
            collapsed: true
            fields:
              - { label: "Texto Encabezado / Hero Eyebrow", name: "heroEyebrow", widget: "string" }
              - { label: "Título Principal / Hero Headline", name: "heroHeadline", widget: "string" }
              - { label: "Subtítulo / Hero Subheadline", name: "heroSubheadline", widget: "text" }
              - { label: "Título Pestaña Navegador / Page Title", name: "pageTitle", widget: "string" }
