backend:
  name: git-gateway
  branch: main

# Files are committed directly to the repository — no media uploads needed
media_folder: "assets/images/blog"
public_folder: "/assets/images/blog"

# Saves go live immediately upon clicking Publish
publish_mode: simple

collections:
  - name: "blog_manager"
    label: "Blog Manager"
    files:

      # ───────────────────────────────────────────────────────────────────────
      # 🇬🇧 ENGLISH BLOG POSTS
      # ───────────────────────────────────────────────────────────────────────
      - name: "blog_en_posts"
        label: "🇬🇧 English Blog Posts"
        file: "assets/js/i18n/en/blog.json"
        fields:
          - label: "Blog Posts"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}}  •  {{fields.category}}  •  {{fields.date}}"
            fields:
              - label: "Article Title"
                name: "title"
                widget: "string"
                hint: "The main headline of your article."
              - label: "URL Link ID (Slug)"
                name: "id"
                widget: "string"
                hint: "Unique URL slug (e.g. 'what-is-retatrutide'). IMPORTANT: Also add a post with this exact ID in Spanish Blog Posts!"
              - label: "Category"
                name: "category"
                widget: "select"
                options:
                  - "Medical Weight Loss"
                  - "Peptide Therapy"
                  - "Hormone Optimization"
                  - "Advanced Diagnostics"
                  - "Regenerative Medicine"
                  - "Detox & Recovery"
                  - "IV Therapy"
              - label: "Author Name"
                name: "author"
                widget: "string"
                hint: "E.g. Dr. Marcus Vance, MD"
              - label: "Publish Date"
                name: "date"
                widget: "string"
                hint: "E.g. August 14, 2026"
              - label: "Card Summary Preview"
                name: "excerpt"
                widget: "text"
                hint: "1-2 sentence preview displayed on the main blog page."

              # Article Content Sections
              - label: "Article Content Sections"
                name: "content"
                widget: "object"
                fields:
                  - { label: "Clinical Overview", name: "overview", widget: "markdown", hint: "Main introduction and overview." }
                  - { label: "Consumer Safety", name: "consumerSafety", widget: "markdown", hint: "Safety considerations." }
                  - { label: "Candidacy Requirements", name: "candidacyRequirements", widget: "markdown", hint: "Who is a good candidate." }
                  - { label: "Timeline Expectations", name: "timelineExpectations", widget: "markdown", hint: "Expected timeline and milestones." }
                  - { label: "Potential Downtime", name: "downtime", widget: "markdown", hint: "Physical recovery or downtime." }
                  - { label: "Expected Results", name: "expectedResults", widget: "markdown", hint: "Clinical outcomes and trial results." }
                  - { label: "Clinical Risks", name: "clinicalRisks", widget: "markdown", hint: "Known side effects and risks." }

      # ───────────────────────────────────────────────────────────────────────
      # 🇪🇸 SPANISH BLOG POSTS
      # ───────────────────────────────────────────────────────────────────────
      - name: "blog_es_posts"
        label: "🇪🇸 Spanish Blog Posts (Español)"
        file: "assets/js/i18n/es/blog.json"
        fields:
          - label: "Artículos / Blog Posts"
            name: "posts"
            widget: "list"
            summary: "{{fields.title}}  •  {{fields.category}}  •  {{fields.date}}"
            fields:
              - label: "Título / Title"
                name: "title"
                widget: "string"
              - label: "ID del Artículo (URL Link)"
                name: "id"
                widget: "string"
                hint: "Debe ser IDÉNTICO a la versión en inglés (ej. 'what-is-retatrutide')."
              - label: "Categoría / Category"
                name: "category"
                widget: "select"
                options:
                  - "Pérdida de Peso Médica"
                  - "Terapia de Péptidos"
                  - "Optimización Hormonal"
                  - "Diagnósticos Avanzados"
                  - "Medicina Regenerativa"
                  - "Desintoxicación y Recuperación"
                  - "Terapia IV"
              - label: "Autor / Author"
                name: "author"
                widget: "string"
              - label: "Fecha / Date"
                name: "date"
                widget: "string"
                hint: "Ej. 14 de agosto de 2026"
              - label: "Resumen Breve / Excerpt"
                name: "excerpt"
                widget: "text"

              # Article Content Sections
              - label: "Secciones del Artículo"
                name: "content"
                widget: "object"
                fields:
                  - { label: "Resumen Clínico / Clinical Overview", name: "overview", widget: "markdown" }
                  - { label: "Seguridad del Consumidor / Consumer Safety", name: "consumerSafety", widget: "markdown" }
                  - { label: "Requisitos de Candidatura / Candidacy Requirements", name: "candidacyRequirements", widget: "markdown" }
                  - { label: "Expectativas de Tiempo / Timeline", name: "timelineExpectations", widget: "markdown" }
                  - { label: "Tiempo de Inactividad / Downtime", name: "downtime", widget: "markdown" }
                  - { label: "Resultados Esperados / Expected Results", name: "expectedResults", widget: "markdown" }
                  - { label: "Riesgos Clínicos / Clinical Risks", name: "clinicalRisks", widget: "markdown" }
