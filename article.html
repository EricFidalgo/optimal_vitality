<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clinical Article — Optimal Vitality Institute</title>
    <meta name="description" content="Clinical overview and protocols from the medical experts at Optimal Vitality Institute.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link href="assets/css/main.css?v=1.1" rel="stylesheet">
    <link rel="icon" href="assets/images/icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/images/icons/icon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/images/icons/icon.png">
    <style>

        .article-content p { font-size: 1.1rem; line-height: 1.8; color: #495057; margin-bottom: 1.5rem; }
        .article-section h3 { font-weight: 600; color: var(--secondary-color); margin-top: 2rem; margin-bottom: 1rem; padding-bottom: 0.5rem; border-bottom: 1px solid #e9ecef; }
        #article-hero-section { min-height: 50vh; display: flex; align-items: center; position: relative; }
        .article-meta { letter-spacing: 1px; text-transform: uppercase; font-size: 0.85rem; font-weight: 500; }
    </style>
</head>
<body class="solid-navbar">
    <!-- Shared navbar injected by components.js -->
    <div id="navbar-root"></div>

    <!-- ===== LOWER CONTENT WRAPPER ===== -->
    <div id="lower-content">
        
        <div id="article-content-container">
            <!-- Article Hero -->
            <section id="article-hero-section" class="bg-dark text-white pt-5" style="border-bottom: 4px solid var(--primary-color);">
                <div class="container position-relative z-1 py-5 mt-5">
                    <div class="row justify-content-center">
                        <div class="col-lg-9 text-center">
                            <span id="articleCategory" class="badge px-3 py-2 mb-4 article-meta" style="background-color: rgba(230, 195, 129, 0.15) !important; color: var(--primary-color) !important; border: 1px solid rgba(230, 195, 129, 0.3); font-weight: 600; font-size: 0.8rem; border-radius: 4px; letter-spacing: 1.5px; text-transform: uppercase;"></span>
                            <h1 id="articleTitle" class="display-4 fw-bold mb-4 lh-sm" style="color: var(--primary-color) !important; text-shadow: 0 2px 10px rgba(0,0,0,0.35);"></h1>
                            <div class="d-flex flex-column flex-sm-row align-items-center justify-content-center gap-2 gap-sm-4 text-white-50 mt-4" style="font-size: 0.95rem;">
                                <span class="d-flex align-items-center"><i class="fas fa-user-md me-2 text-primary" style="color: var(--primary-color) !important;"></i><span id="articleAuthor"></span></span>
                                <span class="d-flex align-items-center"><i class="far fa-calendar-alt me-2 text-primary" style="color: var(--primary-color) !important;"></i><span id="articleDate"></span></span>
                            </div>
                        </div>
                    </div>
                </div>
            </section>

            <!-- Article Content -->
            <section class="py-5 bg-white">
                <div class="container py-4">
                    <div class="row justify-content-center">
                        <div class="col-lg-8 article-content">
                            
                            <!-- Clinical Overview -->
                            <div class="article-section">
                                <p id="contentOverview" class="lead fw-normal text-dark"></p>
                            </div>

                            <!-- Consumer Safety -->
                            <div class="article-section">
                                <h3><i class="fas fa-shield-alt text-primary me-2"></i> Consumer Safety</h3>
                                <p id="contentSafety"></p>
                            </div>

                            <!-- Candidacy Requirements -->
                            <div class="article-section">
                                <h3><i class="fas fa-clipboard-check text-primary me-2"></i> Candidacy Requirements</h3>
                                <p id="contentCandidacy"></p>
                            </div>

                            <!-- Timeline Expectations -->
                            <div class="article-section">
                                <h3><i class="fas fa-clock text-primary me-2"></i> Timeline Expectations</h3>
                                <p id="contentTimeline"></p>
                            </div>

                            <!-- Expected Results -->
                            <div class="article-section">
                                <h3><i class="fas fa-chart-line text-primary me-2"></i> Expected Results</h3>
                                <p id="contentResults"></p>
                            </div>

                            <!-- Downtime -->
                            <div class="article-section">
                                <h3><i class="fas fa-bed text-primary me-2"></i> Potential Downtime</h3>
                                <p id="contentDowntime"></p>
                            </div>

                            <!-- Clinical Risks -->
                            <div class="article-section">
                                <h3><i class="fas fa-exclamation-triangle text-danger me-2"></i> Clinical Risks</h3>
                                <p id="contentRisks"></p>
                            </div>

                            <hr class="my-5">
                            <div class="text-center">
                                <h4 class="fw-bold mb-3">Ready to optimize your health?</h4>
                                <p class="text-muted mb-4">Schedule a comprehensive clinical consultation to discuss if this therapy is right for you.</p>
                                <a href="#consultation" class="btn btn-primary btn-lg px-5 py-3 shadow-sm hover-lift" style="background-color:var(--secondary-color); border:0px">Book Consultation</a>
                            </div>
                        </div>
                    </div>
                </div>
            </section>
        </div>

        <div id="disclosures-root"></div>
    </div>

    <!-- Shared footer + mobile sticky CTA injected by components.js -->
    <div id="footer-root"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

    <script src="assets/js/data/global.js?v=1.1"></script>
    <script src="assets/js/data/blog-data.js"></script>
    <script src="assets/js/core/components.js?v=1.1"></script>
    <script src="assets/js/renderers/blog-renderer.js"></script>
    <script src="assets/js/core/main.js?v=1.1"></script>
</body>
</html>
