    <!-- ===== RELATED ARTICLES =====
         Filled by service-renderer.js with the newest posts tagged with this service (content/blog "service" field).
         Stays hidden when the service has no article yet. -->
    <section class="py-5 bg-white" id="related-articles" style="display: none;">
        <div class="container py-4 gs-reveal">
            <div class="row text-center mb-4">
                <div class="col-lg-8 mx-auto">
                    <h2 class="section-title mb-3" style="color: var(--secondary-color);" data-slot="relatedArticlesHeadline"></h2>
                    <p class="lead text-muted" data-slot="relatedArticlesSubheadline"></p>
                </div>
            </div>
            <div class="row justify-content-center g-4" id="related-articles-list"></div>
        </div>
    </section>
