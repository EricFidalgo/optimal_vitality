<!-- ===== CLINICAL DISCLOSURES & MEDICAL OVERSIGHT ===== -->
<section class="clinical-disclosures py-5 bg-light" id="disclosures">
    <div class="container py-4">
        <div class="row align-items-top g-5">
            <div class="col-lg-5">
                <h2 class="fw-bold text-dark text-uppercase lh-sm mb-4" style="letter-spacing: 0.5px; font-size: 2.2rem;" data-i18n="disclosures.title"></h2>
                <p class="text-muted lh-lg mb-0" style="font-size: 1.05rem;" data-i18n="disclosures.intro"></p>
            </div>
            
            <div class="col-lg-7">
                <div class="d-flex flex-column gap-4">
                    <div class="p-4 rounded-4 border d-flex gap-4 align-items-start shadow-sm compliance-panel" style="background-color: #f5eee3 !important; border-color: rgba(230, 195, 129, 0.45) !important;">
                        <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width: 54px; height: 54px; background-color: rgba(230, 195, 129, 0.2); color: var(--primary-color);">
                            <i class="fas fa-user-md fa-lg"></i>
                        </div>
                        <div>
                            <h4 class="h5 fw-bold text-dark mb-2" data-i18n="disclosures.physicianTitle"></h4>
                            <p class="small text-muted lh-lg mb-0" data-i18n="disclosures.physicianText"></p>
                        </div>
                    </div>
                    
                    <div class="p-4 rounded-4 border d-flex gap-4 align-items-start shadow-sm compliance-panel" style="background-color: #f5eee3 !important; border-color: rgba(230, 195, 129, 0.45) !important;">
                        <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0" style="width: 54px; height: 54px; background-color: rgba(230, 195, 129, 0.2); color: var(--primary-color);">
                            <i class="fas fa-file-medical-alt fa-lg"></i>
                        </div>
                        <div>
                            <h4 class="h5 fw-bold text-dark mb-2" data-i18n="disclosures.diagnosticTitle"></h4>
                            <p class="small text-muted lh-lg mb-0" data-i18n="disclosures.diagnosticText"></p>
                        </div>
                    </div>
                </div>
            </div>
        </div>
        
        <!-- LegitScript & FDA Medical Disclaimer -->
        <div class="mt-5 p-4 rounded-4 bg-white border text-muted" style="font-size: 0.85rem; line-height: 1.6; border-color: rgba(230, 195, 129, 0.45) !important;">
            <p class="fw-bold mb-1 text-dark"><i class="fas fa-shield-alt text-primary me-2"></i><span data-i18n="disclosures.disclaimerTitle"></span></p>
            <p class="mb-0" data-i18n="disclosures.disclaimerText"></p>
        </div>
    </div>
</section>
