<!-- ===== CLINIC LOCATION ===== -->
<section class="location-section py-5 bg-white" id="location">
    <div class="container py-4">
        <h2 class="section-title text-center mb-5" data-i18n="location.sectionTitle"></h2>
        <div class="row g-4 align-items-stretch">
            <!-- Location Details Card -->
            <div class="col-lg-5">
                <div class="bg-dark text-white p-4 p-md-5 rounded-4 shadow-lg h-100 d-flex flex-column justify-content-between position-relative overflow-hidden" style="background: linear-gradient(135deg, #1c3838 0%, var(--secondary-color) 100%) !important; border: 1px solid rgba(230, 195, 129, 0.25);">
                    <!-- Subtle background decorative circle -->
                    <div class="position-absolute" style="width: 300px; height: 300px; background: rgba(230, 195, 129, 0.03); border-radius: 50%; top: -100px; right: -100px; pointer-events: none;"></div>
                    
                    <div>
                        <div class="d-inline-flex align-items-center justify-content-center rounded-circle mb-4" style="width: 54px; height: 54px; background-color: rgba(230, 195, 129, 0.15); color: var(--primary-color);">
                            <i class="fas fa-map-marked-alt" style="font-size: 1.5rem;"></i>
                        </div>
                        <h3 class="fw-bold mb-4 text-white" style="font-family: 'Poppins', sans-serif; letter-spacing: 0.5px;" data-i18n="location.clinicName"></h3>
                        
                        <!-- Address -->
                        <div class="d-flex align-items-start mb-4">
                            <i class="fas fa-map-marker-alt mt-1 me-3 fs-5" style="color: var(--primary-color);"></i>
                            <div>
                                <h5 class="fw-bold text-white-50 mb-1" style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;" data-i18n="location.labelAddress"></h5>
                                <p class="mb-0 fw-semibold text-white fs-6" id="location-address">
                                    <!-- Dynamically filled -->
                                </p>
                            </div>
                        </div>
                        
                        <!-- Hours -->
                        <div class="d-flex align-items-start mb-4">
                            <i class="fas fa-clock mt-1 me-3 fs-5" style="color: var(--primary-color);"></i>
                            <div>
                                <h5 class="fw-bold text-white-50 mb-1" style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;" data-i18n="location.labelHours"></h5>
                                <div class="mb-0 fw-semibold text-white fs-6" id="location-hours">
                                    <!-- Dynamically filled -->
                                </div>
                            </div>
                        </div>

                        <!-- Contact Info -->
                        <div class="d-flex align-items-start mb-0">
                            <i class="fas fa-phone-alt mt-1 me-3 fs-5" style="color: var(--primary-color);"></i>
                            <div>
                                <h5 class="fw-bold text-white-50 mb-1" style="font-size: 0.85rem; text-transform: uppercase; letter-spacing: 0.5px;" data-i18n="location.labelContact"></h5>
                                <p class="mb-0 fw-semibold text-white fs-6" id="location-contact">
                                    <!-- Dynamically filled -->
                                </p>
                            </div>
                        </div>
                    </div>
                    
                    <div class="mt-5 pt-2">
                        <a id="get-directions-btn" href="#" target="_blank" rel="noopener noreferrer" class="btn cta-btn w-100 rounded-pill py-3 fw-bold text-uppercase d-flex align-items-center justify-content-center gap-2">
                            <i class="fas fa-directions"></i> <span data-i18n="location.getDirections"></span>
                        </a>
                    </div>
                </div>
            </div>
            
            <!-- Map Embed Frame -->
            <div class="col-lg-7">
                <div class="rounded-4 overflow-hidden shadow-lg h-100 border" style="border-color: rgba(230, 195, 129, 0.2) !important; min-height: 450px; position: relative;">
                    <iframe 
                        id="google-map-iframe"
                        src=""
                        width="100%" 
                        height="100%" 
                        style="border:0; display: block; position: absolute; top: 0; left: 0; width: 100%; height: 100%;" 
                        allowfullscreen="" 
                        loading="lazy" 
                        referrerpolicy="no-referrer-when-downgrade">
                    </iframe>
                </div>
            </div>
        </div>
    </div>
</section>
