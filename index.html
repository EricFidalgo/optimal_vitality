<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OVI Wellness — Doctor-Led Performance Medicine in St. Petersburg, FL</title>
    <meta name="description" content="Advanced Wellness &amp; Regenerative Aesthetics at OVI Wellness. Doctor-led, medically supervised, data-driven protocols.">
    <link rel="canonical" href="https://oviwellness.com/">
    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website">
    <meta property="og:url" content="https://oviwellness.com/">
    <meta property="og:title" content="OVI Wellness — Doctor-Led Performance Medicine in St. Petersburg, FL">
    <meta property="og:description" content="Advanced Wellness &amp; Regenerative Aesthetics at OVI Wellness. Doctor-led, medically supervised, data-driven protocols.">

    <!-- Twitter -->
    <meta property="twitter:card" content="summary">
    <meta property="twitter:url" content="https://oviwellness.com/">
    <meta property="twitter:title" content="OVI Wellness — Doctor-Led Performance Medicine in St. Petersburg, FL">
    <meta property="twitter:description" content="Advanced Wellness &amp; Regenerative Aesthetics at OVI Wellness. Doctor-led, medically supervised, data-driven protocols.">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&family=Urbanist:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link href="assets/css/main.css?v=1.4" rel="stylesheet">
    <link rel="icon" href="assets/images/icons/icon.svg" type="image/svg+xml">
    <link rel="icon" href="assets/images/icons/icon.ico" sizes="32x32">
    <link rel="apple-touch-icon" href="assets/images/icons/icon.png">
    <script src="https://identity.netlify.com/v1/netlify-identity-widget.js"></script>
    <script>
      if (window.netlifyIdentity) {
        window.netlifyIdentity.on("init", user => {
          if (!user) {
            window.netlifyIdentity.on("login", () => {
              document.location.href = "/admin/";
            });
          }
        });
      }
    </script>
</head>
<body>
    <!-- Shared navbar injected by components.js?v=1.3 -->
    <div id="navbar-root"></div>

    <!-- ===== HERO ===== -->
    <header class="hero" id="home">
        <div id="particle-canvas"></div>
        <div class="container">
            <div class="row align-items-center justify-content-center text-center">
                <div class="col-lg-10 hero-content" style="opacity: 0; margin-top:2rem">
                    <h1 data-i18n="hero.headline"></h1>
                    <p data-i18n="hero.subheadline"></p>
                </div>
                <div class="hero-actions mt-4" style="opacity: 0;">
                    <a href="#consultation" class="btn cta-btn btn-lg rounded-pill px-4 py-3" data-i18n="hero.cta"></a>
                </div>
                <div class="blob-menu-container mt-5 pt-5"></div>
                <div class="mt-4 pt-2">
                    <a href="#services" class="hero-modalities-badge text-decoration-none d-inline-flex align-items-center gap-2" style="opacity: 0;">
                        <span class="modalities-text" data-i18n="hero.exploreBtn"></span>
                        <i class="fas fa-chevron-down modalities-arrow ms-1"></i>
                    </a>
                </div>
            </div>
        </div>
    </header>


    <!-- ===== CORE OPTIMIZATION THERAPIES ===== -->
    <section class="section-light py-5" id="core-therapies">
        <div class="container py-4">
            <div class="text-center mb-5">
                <h2 class="section-title" data-i18n="coreTherapies.sectionTitle"></h2>
            </div>
            <div class="text-center mb-5">
                <div class="therapy-tabs-wrapper">
                    <ul class="nav nav-pills" id="therapy-tabs" role="tablist"></ul>
                </div>
            </div>
            <div class="tab-content" id="therapy-tabs-content"></div>
        </div>
    <!-- ===== MEMBERSHIP PLANS & PROTOCOL TIERS ===== -->
    <section class="membership-section py-5 bg-white" id="memberships">
        <div class="container py-4">
            <!-- Section Header -->
            <div class="text-center mb-5">
                <h2 class="section-title mb-0" data-i18n="memberships.sectionTitle"></h2>
            </div>

            <!-- Desktop Grid (Visible on Desktop: 992px and up) -->
            <div class="row g-4 justify-content-center align-items-stretch mb-5 d-none d-lg-flex pt-3" id="memberships-desktop"></div>

            <!-- Mobile & iPad Expandable Accordion Stack (< 992px) -->
            <div class="d-lg-none mb-5">
                <div class="accordion mobile-plan-accordion d-flex flex-column gap-3" id="mobilePlanAccordion"></div>
            </div>

            <!-- IV Therapy Feature Explanation Banner -->
            <div class="iv-explanation-banner p-4 p-md-5 rounded-4 border shadow-lg position-relative">
                <div class="row align-items-center position-relative z-index-1">
                    <div class="col-lg-8 text-center text-lg-start mb-4 mb-lg-0">
                        <div class="d-flex align-items-center justify-content-center justify-content-lg-start gap-3 mb-2">
                            <i class="fas fa-bolt text-primary fs-4"></i>
                            <h4 class="fw-bold mb-0 text-white fs-4" data-i18n="memberships.ivBanner.title"></h4>
                        </div>
                        <p class="text-white-50 mb-0" style="font-size: 1rem; line-height: 1.6;" data-i18n="memberships.ivBanner.body"></p>
                    </div>
                    <div class="col-lg-4 text-center text-lg-end d-flex flex-column flex-sm-row justify-content-center justify-content-lg-end gap-3">
                        <a href="tel:7274768966" class="btn btn-outline-light rounded-pill px-4 py-3 fw-bold text-uppercase d-inline-flex align-items-center justify-content-center gap-2" style="font-size: 0.82rem; letter-spacing: 0.8px;" data-i18n="memberships.ivBanner.callBtn"></a>
                        <a href="#consultation" class="btn cta-btn rounded-pill px-4 py-3 fw-bold text-uppercase d-inline-flex align-items-center justify-content-center gap-2" style="font-size: 0.82rem; letter-spacing: 0.8px;" data-i18n="memberships.ivBanner.bookBtn"></a>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== WHY CHOOSE OUR MEDICAL TEAM (COMBINED COMPACT SECTION) ===== -->
    <section class="py-5 bg-white position-relative" id="why-us">
        <div class="container py-3">
            <!-- Section Header -->
            <div class="text-center mb-4 max-w-800 mx-auto">
                <h2 class="section-title mb-0" data-i18n="whyUs.sectionTitle"></h2>
            </div>

            <!-- Combined 2-Column Layout -->
            <div class="row g-4 align-items-center">
                <!-- Left Column: Doctor Team Photo -->
                <div class="col-lg-5">
                    <div class="card border-0 rounded-4 overflow-hidden shadow-lg position-relative">
                        <div class="team-group-img-wrapper d-flex flex-column justify-content-center align-items-center position-relative p-4" style="height: 320px; background: linear-gradient(135deg, #071712 0%, #091f18 100%);">
                            <img src="assets/images/icons/logo.svg" alt="Optimal Vitality Logo" class="mb-4" style="width: clamp(190px, 54vw, 325px); height: auto;">
                            
                            <div class="position-absolute bottom-0 start-0 end-0 p-3 text-start">
                                <div class="d-flex align-items-center justify-content-between text-white">
                                    <div>
                                        <div class="fw-bold text-uppercase" style="font-size: 0.85rem; letter-spacing: 0.5px;"><i class="fas fa-shield-alt text-warning me-1"></i> <span data-i18n="whyUs.teamBadge"></span></div>
                                        <div class="small opacity-75" data-i18n="whyUs.teamSub"></div>
                                    </div>
                                </div>
                            </div>
                        </div>
                        <div class="card-body p-3 bg-white text-center border-top">
                            <a href="team" class="btn btn-sm btn-outline-dark bg-white rounded-pill fw-bold px-3 py-2" style="font-size: 0.8rem;" data-i18n="whyUs.meetBtn"></a>
                        </div>
                    </div>
                </div>

                <!-- Right Column: 3 Simple Reasons to Choose Us -->
                <div class="col-lg-7">
                    <!-- Desktop Grid (Hidden on Mobile) -->
                    <div class="d-none d-lg-flex flex-column gap-3" id="why-us-desktop"></div>

                    <!-- Mobile Unified Benefits Card (Hidden on Desktop < 992px) -->
                    <div class="d-lg-none mt-3">
                        <div class="card border-0 rounded-4 p-3 bg-white border border-light-subtle shadow-sm">
                            <div class="d-flex flex-column gap-3"></div>
                        </div>
                    </div>
                </div>
        </div>
    </section>

    <!-- ===== ADDITIONAL OPTIMIZATION SERVICES (moved after trust is built) ===== -->
    <section class="premium-services pt-2 pb-5" id="services">
        <div class="container py-5 gs-reveal">
            <div class="row text-center mb-4">
                <div class="col-lg-8 mx-auto text-white">
                    <h2 class="section-title mb-0 text-white" data-i18n="additionalServices.sectionTitle"></h2>
                </div>
            </div>
            <div class="row g-4 justify-content-center d-none d-lg-flex" id="services-desktop"></div>

            <div class="d-lg-none position-relative mt-4">
                <div class="native-scroll-wrapper" id="services-mobile-track"></div>
                <div class="custom-carousel-controls d-flex align-items-center justify-content-center mt-3">
                    <div class="carousel-indicators position-relative m-0" id="services-mobile-indicators"></div>
                </div>
            </div>
        </div>
    </section>



    <!-- ===== FAQs ===== -->
    <section class="faqs py-5 bg-light" id="faqs">
        <div class="container py-4">
            <h2 class="section-title text-center mb-5" data-i18n="faqs.sectionTitle"></h2>
            <div class="row justify-content-center">
                <div class="col-lg-8">
                    <div class="accordion" id="faqAccordion"></div>
                </div>
            </div>
        </div>
    </section>

    <!-- ===== CLINIC LOCATION ===== -->
    <div data-include-component="location"></div>

    <!-- Shared footer + mobile sticky CTA injected by components.js?v=1.3 -->
    <div id="footer-root"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/ScrollTrigger.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/tsparticles@2/tsparticles.bundle.min.js"></script>

    <script src="assets/js/i18n/i18n.js?v=1.3"></script>
    <script src="assets/js/renderers/home-renderer.js"></script>

    <script src="assets/js/core/component-loader.js"></script>
    <script src="assets/js/core/components.js?v=1.3"></script>
    <script src="assets/js/core/main.js?v=1.2"></script>
    <script src="assets/js/core/particles.js"></script>
